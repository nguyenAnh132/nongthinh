server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    # API belongs to the host reverse proxy; never return SPA HTML for API errors.
    location /api/ { return 404; }
    location = /index.html {
        add_header Cache-Control 'no-cache' always;
    }
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp|mp4)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
