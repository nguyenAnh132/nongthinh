name: nongthinh-web
services:
  frontend:
    image: nguyenanh132/nongthinh-frontend:${FRONTEND_TAG:?Missing FRONTEND_TAG}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8080'
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
