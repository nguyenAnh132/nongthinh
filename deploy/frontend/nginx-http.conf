# Install on the HOST at /etc/nginx/sites-available/nongthinh.
# This is HTTP bootstrap configuration. Certbot adds TLS in the next step.
server {
    listen 80;
    server_name nongthinh.nvtanh.id.vn;
    server_tokens off;
    client_max_body_size 110m;

    location ^~ /api/v1/ {
        # Preserve /api/v1/... for Gateway StripPrefix rules.
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
    location /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
