spring:
  application:
    name: agri-catalog-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
            followRedirects: false

cookie:
  access-token-name: access_token

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG

brand-access:
  profile-service:
    url: ${BRAND_ACCESS_PROFILE_SERVICE_URL:http://localhost:9092/profile}
    connect-timeout-ms: ${BRAND_ACCESS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BRAND_ACCESS_READ_TIMEOUT_MS:3000}
