server:
  port: ${API_GATEWAY_PORT:8888}


app:
  api-prefix: ${API_PREFIX:/api/v1}

  cors:
    allowed-origins-paramname: ${CORS_ALLOWED_ORIGINS_PARAMNAME}

  internal:
    bo-portal-api-key: ${BO_PORTAL_INTERNAL_API_KEY}


services:
  auth:
    url: ${AUTH_SERVICE_URL}

  bo-portal:
    url: ${BO_PORTAL_SERVICE_URL}

  profile:
    url: ${PROFILE_SERVICE_URL}

  location:
    url: ${LOCATION_SERVICE_URL}

  notification:
    url: ${NOTIFICATION_SERVICE_URL}

  brand:
    url: ${BRAND_SERVICE_URL}

  file:
    url: ${FILE_SERVICE_URL}

  rice-disease-diagnosis:
    url: ${RICE_DISEASE_DIAGNOSIS_SERVICE_URL}

  agri-catalog:
    url: ${AGRI_CATALOG_SERVICE_URL}

  post:
    url: ${POST_SERVICE_URL}


client:
  bo-portal-service:
    url: ${BO_PORTAL_SERVICE_BASE_URL}


spring:
  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:45s}

  mvc:
    async:
      request-timeout: ${MVC_ASYNC_REQUEST_TIMEOUT:30m}

  cloud:
    gateway:
      server:
        webmvc:
          streaming-media-types:
            - ${GATEWAY_STREAMING_MEDIA_TYPE_SSE:text/event-stream}
            - ${GATEWAY_STREAMING_MEDIA_TYPE_SSE_UTF8:text/event-stream;charset=UTF-8}
            - ${GATEWAY_STREAMING_MEDIA_TYPE_NDJSON:application/x-ndjson}