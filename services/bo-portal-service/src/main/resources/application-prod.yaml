server:
  port: ${BO_PORTAL_SERVICE_PORT:9096}
  servlet:
    context-path: ${BO_PORTAL_CONTEXT_PATH:/bo-portal}

spring:
  datasource:
    url: ${BO_PORTAL_SERVICE_DB_URL}
    username: ${BO_PORTAL_SERVICE_DB_USERNAME}
    password: ${BO_PORTAL_SERVICE_DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

    api-key:
      current-service-key: ${BO_PORTAL_SERVICE_API_KEY}
