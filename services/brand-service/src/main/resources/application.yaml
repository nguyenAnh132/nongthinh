spring:
  application:
    name: brand-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY

  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
            followRedirects: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: brand-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

messaging:
  kafka:
    topics:
      brand-profile-created: ${KAFKA_TOPIC_BRAND_PROFILE_CREATED:brand-profile-created}
      brand-documents-requested: ${KAFKA_TOPIC_BRAND_DOCUMENTS_REQUESTED:brand-documents-requested}
      brand-needs-revision: ${KAFKA_TOPIC_BRAND_NEEDS_REVISION:brand-needs-revision}
      brand-profile-approved: ${KAFKA_TOPIC_BRAND_PROFILE_APPROVED:brand-profile-approved}
      brand-profile-rejected: ${KAFKA_TOPIC_BRAND_PROFILE_REJECTED:brand-profile-rejected}
      brand-documents-submitted: ${KAFKA_TOPIC_BRAND_DOCUMENTS_SUBMITTED:brand-documents-submitted}

cookie:
  access-token-name: access_token

camunda:
  bpm:
    auto-deployment-enabled: true
    deployment-resource-pattern: classpath*:processes/**/*.bpmn
    webapp:
      index-redirect-enabled: true

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG

brand-access:
  profile-service:
    url: ${BRAND_ACCESS_PROFILE_SERVICE_URL:http://localhost:9092/profile}
    connect-timeout-ms: ${BRAND_ACCESS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BRAND_ACCESS_READ_TIMEOUT_MS:3000}
