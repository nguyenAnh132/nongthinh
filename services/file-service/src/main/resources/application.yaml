spring:
  application:
    name: file-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

cookie:
  access-token-name: access_token

app:
  upload:
    max-size-bytes:
      AVATAR: 2097152
      BRAND_LOGO: 2097152
      BRAND_BANNER: 5242880
      BUSINESS_LICENSE: 10485760
      PRODUCT_IMAGE: 5242880
      DISEASE_IMAGE: 5242880
      DIAGNOSIS_IMAGE: 5242880
      POST_IMAGE: 5242880
      POST_VIDEO: 52428800
      MODEL_ARTIFACT: 52428800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG
