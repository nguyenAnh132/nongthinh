spring:
  application:
    name: file-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY
      clients:
        bo-portal-service:
          url: ${FILE_BO_PORTAL_SERVICE_URL:http://localhost:9096/bo-portal}
          api-key: ${BO_PORTAL_SERVICE_API_KEY:bo-portal}

  cloud:
    openfeign:
      client:
        config:
          bo-portal-service:
            connectTimeout: ${BO_PORTAL_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${BO_PORTAL_READ_TIMEOUT_MS:2000}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

cookie:
  access-token-name: access_token

app:
  upload:
    default:
      max-size-bytes:
        AVATAR: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_AVATAR:2097152}
        BRAND_LOGO: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_BRAND_LOGO:2097152}
        BRAND_BANNER: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_BRAND_BANNER:5242880}
        BUSINESS_LICENSE: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_BUSINESS_LICENSE:10485760}
        PRODUCT_IMAGE: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_PRODUCT_IMAGE:5242880}
        DISEASE_IMAGE: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_DISEASE_IMAGE:5242880}
        DIAGNOSIS_IMAGE: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_DIAGNOSIS_IMAGE:5242880}
        POST_IMAGE: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_POST_IMAGE:5242880}
        POST_VIDEO: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_POST_VIDEO:52428800}
        MODEL_ARTIFACT: ${FILE_UPLOAD_DEFAULT_MAX_BYTES_MODEL_ARTIFACT:52428800}

caching:
  file-upload-policy-ttl-seconds: ${FILE_UPLOAD_POLICY_TTL_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG

brand-access:
  profile-service:
    url: ${BRAND_ACCESS_PROFILE_SERVICE_URL:http://localhost:9092/profile}
    connect-timeout-ms: ${BRAND_ACCESS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BRAND_ACCESS_READ_TIMEOUT_MS:3000}
