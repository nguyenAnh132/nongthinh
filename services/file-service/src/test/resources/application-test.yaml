app:
  storage:
    bucket: nongthinh-files-test
    public-base-url: http://localhost:9095/files/public
    base-path: ./target/test-storage

  upload:
    default:
      max-size-bytes:
        AVATAR: 2097152
        BRAND_LOGO: 2097152
        BRAND_BANNER: 5242880
        BUSINESS_LICENSE: 10485760
        PRODUCT_IMAGE: 5242880
        DISEASE_IMAGE: 5242880
        DIAGNOSIS_IMAGE: 5242880
        POST_IMAGE: 5242880
        POST_VIDEO: 52428800
        MODEL_ARTIFACT: 52428800

cookie:
  secure: false
  http-only: true
  access-token-name: access_token
  refresh-token-name: refresh_token
  same-site: Lax
  access-path: /
  refresh-path: /

spring:
  datasource:
    url: jdbc:h2:mem:file_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.nongthinh.nvtanh.id.vn/realms/nongthinh
    api-key:
      header-name: X-API-KEY
      current-service-key: file
