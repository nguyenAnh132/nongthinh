spring:
  application:
    name: notification-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: notification-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mvc:
    async:
      request-timeout: ${NOTIFICATION_ASYNC_REQUEST_TIMEOUT:30m}

messaging:
  kafka:
    topics:
      brand-access-changed: ${KAFKA_TOPIC_BRAND_ACCESS_CHANGED:brand-access-changed}
      brand-documents-requested: ${KAFKA_TOPIC_BRAND_DOCUMENTS_REQUESTED:brand-documents-requested}
      brand-needs-revision: ${KAFKA_TOPIC_BRAND_NEEDS_REVISION:brand-needs-revision}
      brand-profile-approved: ${KAFKA_TOPIC_BRAND_PROFILE_APPROVED:brand-profile-approved}
      brand-profile-rejected: ${KAFKA_TOPIC_BRAND_PROFILE_REJECTED:brand-profile-rejected}
      post-engagement: ${KAFKA_TOPIC_POST_ENGAGEMENT:post.engagement.v1}
      profile-notifications: ${KAFKA_TOPIC_PROFILE_NOTIFICATIONS:profile.notifications.v1}

cookie:
  access-token-name: access_token

in-app-notification:
  enabled: ${IN_APP_NOTIFICATION_ENABLED:true}

post-realtime:
  enabled: ${POST_REALTIME_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG

brand-access:
  profile-service:
    url: ${BRAND_ACCESS_PROFILE_SERVICE_URL:http://localhost:9092/profile}
    connect-timeout-ms: ${BRAND_ACCESS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BRAND_ACCESS_READ_TIMEOUT_MS:3000}
