spring:
  application:
    name: notification-service
  profiles:
    default: dev
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      enable-auto-commit: false
  jpa:
    open-in-view: false
  mvc:
    async:
      request-timeout: 30m
  flyway:
    enabled: true

in-app-notification:
  enabled: ${IN_APP_NOTIFICATION_ENABLED:true}
post-realtime:
  enabled: ${POST_REALTIME_ENABLED:true}
  topic: ${POST_ENGAGEMENT_TOPIC:post.engagement.v1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
