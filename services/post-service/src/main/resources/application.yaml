spring:
  application:
    name: post-service
  profiles:
    default: dev
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:160.187.229.28:9002}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: false

post:
  limits:
    content-length: ${POST_CONTENT_MAX_LENGTH:2000}
    media-per-post: ${POST_MEDIA_MAX_COUNT:10}
    page-size: ${POST_PAGE_MAX_SIZE:100}
  features:
    allowed-visibility: PUBLIC
    allowed-media-type: IMAGE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

cookie:
  access-token-name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}

post-outbox:
  enabled: ${POST_OUTBOX_ENABLED:true}
  topic: ${POST_ENGAGEMENT_TOPIC:post.engagement.v1}
  poll-ms: 500
  batch-size: 50
