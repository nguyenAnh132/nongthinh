spring:
  application:
    name: post-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: false

  security:
    api-key:
      header-name: X-API-KEY

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

post:
  limits:
    content-length: ${POST_CONTENT_MAX_LENGTH:2000}
    media-per-post: ${POST_MEDIA_MAX_COUNT:10}
    page-size: ${POST_PAGE_MAX_SIZE:100}
  features:
    allowed-visibility: PUBLIC
    allowed-media-type: IMAGE

post-outbox:
  enabled: ${POST_OUTBOX_ENABLED:true}
  topic: ${POST_ENGAGEMENT_TOPIC:post.engagement.v1}
  poll-ms: ${POST_OUTBOX_POLL_MS:500}
  batch-size: ${POST_OUTBOX_BATCH_SIZE:50}

cookie:
  access-token-name: access_token

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nongthinh.post_service: DEBUG
    org.hibernate.SQL: INFO
