spring:
  application:
    name: profile-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
            followRedirects: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: profile-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

messaging:
  kafka:
    topics:
      brand-access-changed: ${KAFKA_TOPIC_BRAND_ACCESS_CHANGED:brand-access-changed}
      farmer-profile-creation-requested: ${KAFKA_TOPIC_FARMER_PROFILE_CREATION_REQUESTED:farmer-profile-creation-requested}
      admin-profile-creation-requested: ${KAFKA_TOPIC_ADMIN_PROFILE_CREATION_REQUESTED:admin-profile-creation-requested}
      brand-profile-creation-requested: ${KAFKA_TOPIC_BRAND_PROFILE_CREATION_REQUESTED:brand-profile-creation-requested}
      brand-profile-created: ${KAFKA_TOPIC_BRAND_PROFILE_CREATED:brand-profile-created}
      brand-documents-submitted: ${KAFKA_TOPIC_BRAND_DOCUMENTS_SUBMITTED:brand-documents-submitted}
      brand-profile-rejected: ${KAFKA_TOPIC_BRAND_PROFILE_REJECTED:brand-profile-rejected}
      post-engagement: ${KAFKA_TOPIC_POST_ENGAGEMENT:post.engagement.v1}
      profile-notifications: ${KAFKA_TOPIC_PROFILE_NOTIFICATIONS:profile.notifications.v1}

cookie:
  access-token-name: access_token

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG
