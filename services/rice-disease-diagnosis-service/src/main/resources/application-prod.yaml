spring:
  application:
    name: rice-disease-diagnosis-service
  datasource:
    url: ${DIAGNOSIS_DB_URL}
    username: ${DIAGNOSIS_DB_USERNAME}
    password: ${DIAGNOSIS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:9099}
  servlet:
    context-path: /diagnosis
