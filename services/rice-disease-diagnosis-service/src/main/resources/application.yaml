spring:
  application:
    name: rice-disease-diagnosis-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true

  security:
    api-key:
      header-name: X-API-KEY

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
            followRedirects: false

model-validation:
  max-artifact-bytes: ${MODEL_VALIDATION_MAX_ARTIFACT_BYTES:104857600}
  max-cached-model-versions: ${MODEL_VALIDATION_MAX_CACHED_MODEL_VERSIONS:4}

diagnosis:
  max-files-per-request: ${DIAGNOSIS_MAX_FILES_PER_REQUEST:5}
  max-image-bytes: ${DIAGNOSIS_MAX_IMAGE_BYTES:5242880}
  max-image-pixels: ${DIAGNOSIS_MAX_IMAGE_PIXELS:40000000}
  confidence-threshold: ${DIAGNOSIS_CONFIDENCE_THRESHOLD:0.25}
  nms-iou-threshold: ${DIAGNOSIS_NMS_IOU_THRESHOLD:0.45}
  max-concurrent-inferences: ${DIAGNOSIS_MAX_CONCURRENT_INFERENCES:4}
  cleanup:
    fixed-delay-ms: ${DIAGNOSIS_CLEANUP_FIXED_DELAY_MS:60000}

cookie:
  access-token-name: access_token

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,diagnosisModelRuntime
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nongthinh: DEBUG

brand-access:
  profile-service:
    url: ${BRAND_ACCESS_PROFILE_SERVICE_URL:http://localhost:9092/profile}
    connect-timeout-ms: ${BRAND_ACCESS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BRAND_ACCESS_READ_TIMEOUT_MS:3000}
