spring:
  application:
    name: rice-disease-diagnosis-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://keycloak.nongthinh.nvtanh.id.vn/realms/nongthinh}
    api-key:
      current-service-key: ${RICE_DISEASE_DIAGNOSIS_SERVICE_API_KEY:diagnosis}
      clients:
        agri-catalog-service:
          url: ${AGRI_CATALOG_SERVICE_URL:http://localhost:9098/agri-catalog}
          api-key: ${AGRI_CATALOG_SERVICE_API_KEY:agri-catalog}
        file-service:
          url: ${FILE_SERVICE_URL:http://localhost:9095/files}
          api-key: ${FILE_SERVICE_API_KEY:file}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:10000}
            followRedirects: false

model-validation:
  max-artifact-bytes: ${MODEL_VALIDATION_MAX_ARTIFACT_BYTES:104857600}
  max-cached-model-versions: ${MODEL_VALIDATION_MAX_CACHED_MODEL_VERSIONS:4}

diagnosis:
  max-files-per-request: ${DIAGNOSIS_MAX_FILES_PER_REQUEST:5}
  max-image-bytes: ${DIAGNOSIS_MAX_IMAGE_BYTES:5242880}
  max-image-pixels: ${DIAGNOSIS_MAX_IMAGE_PIXELS:40000000}
  confidence-threshold: ${DIAGNOSIS_CONFIDENCE_THRESHOLD:0.25}
  nms-iou-threshold: ${DIAGNOSIS_NMS_IOU_THRESHOLD:0.45}
  max-concurrent-inferences: ${DIAGNOSIS_MAX_CONCURRENT_INFERENCES:4}
  cleanup:
    fixed-delay-ms: ${DIAGNOSIS_CLEANUP_FIXED_DELAY_MS:60000}

cookie:
  access-token-name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,diagnosisModelRuntime
  metrics:
    tags:
      application: ${spring.application.name}
